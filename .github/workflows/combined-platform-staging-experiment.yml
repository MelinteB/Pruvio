name: Combined Core + Business staging experiment checks

on:
  push:
    branches:
      - experiment/platform-combined-staging-20261112
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/frontend/package-lock.json
            backend/business_frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run isolated ASGI routing and source checks
        working-directory: backend
        run: |
          python -m pip install 'fastapi>=0.116,<1' 'httpx>=0.27,<1' 'sqlalchemy>=2.0,<3' 'pytest>=8,<10'
          python -m pytest -q tests/test_combined_platform_routes.py
      - name: Build and verify Pruvs Core React
        working-directory: backend/frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          python ../scripts/check_react_build.py
      - name: Build Pruvs Business React under /business
        working-directory: backend/business_frontend
        env:
          VITE_API_BASE: /business
          VITE_PRUVS_CUSTOMER_URL: ''
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/business/
      - name: Verify both compiled apps' entrypoints
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          root = Path('backend')
          c = root/'frontend/dist/index.html'
          b = root/'business_frontend/dist/index.html'
          assert c.is_file() and b.is_file(), 'Both Vite entrypoints must exist'
          text=b.read_text()
          assert '/business/assets/' in text, 'Business assets must be scoped to /business/'
          assert (root/'business_frontend/dist/merchant-login-entry.js').is_file()
          assert (root/'business_frontend/dist/merchant-enroll.html').is_file()
          for f in (root/'business_frontend/dist/assets').glob('*.js'):
              js=f.read_text()
              assert 'http://127.0.0.1:8001' not in js, 'No localhost API in compiled Business'
              assert 'https://pruvs-business-api-staging.onrender.com/v1' not in js, 'Business must use same origin'
          print('PASS: two React builds are present and Business paths are scoped')
          PY
