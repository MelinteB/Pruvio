name: Verify draft Core identity 7.1.67
on:
  pull_request:
    branches: ["release/core-7.1.66-business-0.6.22"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_identity_provider_contract_v7167.py tests/test_core_social_auth_security_20261123.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: backend/frontend
