name: Verify Pruvs Core login method grid

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/frontend/src/Auth.jsx'
      - 'backend/frontend/src/LoginMethodGrid.jsx'
      - 'backend/frontend/src/login-method-grid.css'
      - 'backend/frontend/src/login_method_grid.test.jsx'
      - 'backend/frontend/src/PhoneNumberField.jsx'
      - 'backend/frontend/src/phone-number-field.css'
      - 'backend/frontend/src/phone_number_field.test.jsx'
      - 'backend/app/services/phone_numbers.py'
      - 'backend/app/services/onboarding_otp_service.py'
      - 'backend/app/react_app/phone_api.py'
      - 'backend/app/react_app/api.py'
      - 'backend/app/react_main.py'
      - 'backend/requirements.txt'
      - 'backend/tests/test_phone_numbers_country_signup.py'
      - '.github/workflows/verify-core-login-method-picker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  login-picker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test phone normalization and country-specific length validation
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check 'phonenumbers>=8.13,<10' pytest
          python -m pytest -q tests/test_phone_numbers_country_signup.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json
      - name: Install Core dependencies
        working-directory: backend/frontend
        run: npm ci --no-audit --no-fund
      - name: Test safe login methods
        working-directory: backend/frontend
        run: npx vitest run src/login_method_grid.test.jsx src/optional_registration.test.jsx src/phone_number_field.test.jsx
      - name: Build Core frontend
        working-directory: backend/frontend
        run: npm run build
