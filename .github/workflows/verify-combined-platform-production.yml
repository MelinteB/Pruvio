name: Combined production promotion — Core and Business
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - release/pruvs-platform-v7150-b066-combined-prod-20261113
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/frontend/package-lock.json
            backend/business_frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python and test isolated routing and configuration
        working-directory: backend
        run: |
          python -m pip install 'fastapi>=0.116,<1' 'httpx>=0.27,<1' 'sqlalchemy>=2.0,<3' 'pydantic-settings>=2.5,<3' 'pytest>=8,<10'
          python -m compileall -q app/platform_production.py app/platform_combined.py app/react_app/loyalty_gateway.py business
          python -m pytest -q tests/test_combined_platform_routes.py tests/test_combined_database_url_v066.py tests/test_combined_production_config.py tests/test_stage_schema_v066.py
      - name: Test and build Core React
        working-directory: backend/frontend
        env:
          VITE_PRUVS_CORE_V7140_ENABLED: 'true'
          VITE_PRUVS_CORE_V7141_PROJECTS_ENABLED: 'true'
          VITE_PRUVS_LOYALTY_UI_ENABLED: 'true'
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Verify Core stamped build version
        working-directory: backend
        run: |
          python scripts/check_react_build.py
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('frontend/dist/build-manifest.json').read_text())['version']=='7.1.50'
          PY
      - name: Build Business React at /business/
        working-directory: backend/business_frontend
        env:
          VITE_API_BASE: /business
          VITE_PRUVS_CUSTOMER_URL: ''
        run: |
          npm ci --no-audit --no-fund
          npm run build -- --base=/business/
      - name: Verify namespaced paths, no staging URLs, and both UIs
        run: |
          python - <<'PY'
          from pathlib import Path
          core=Path('backend/frontend/dist')
          business=Path('backend/business_frontend/dist')
          assert (core/'index.html').is_file()
          assert (business/'index.html').is_file()
          assert '/business/assets/' in (business/'index.html').read_text()
          for f in ('merchant-enroll.html','merchant-enroll.css','merchant-enroll.js',
                    'merchant-login-entry.css','merchant-login-entry.js'):
              assert (business/f).is_file(),f
          for p in (business/'assets').glob('*.js'):
              data=p.read_text()
              assert 'pruvs-business-api-staging.onrender.com' not in data
              assert 'http://127.0.0.1:8001' not in data
          print('PASS: Core and Business production build paths')
          PY
