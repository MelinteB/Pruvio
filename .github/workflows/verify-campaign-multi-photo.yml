name: Verify multi-picture Campaign Studio
on:
  pull_request:
    branches: ["release/core-7.1.66-business-0.6.22"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  studio:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests/test_campaign_multi_photo.py tests/test_image_anchored_campaign_v0618.py tests/test_campaign_media_studio_v0615.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build
        working-directory: backend/business_frontend
