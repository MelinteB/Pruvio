name: Verify combined Core and Business identity hardening
on:
  pull_request:
    branches: ["release/core-7.1.66-business-0.6.22"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardening:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r business-requirements.txt pytest
      - run: python -m compileall -q app business scripts
      - run: python -m pytest -q tests/test_loyalty_management_v0624.py tests/test_pilot_enrollment_v0612.py tests/test_campaign_republish_sync_v0618.py tests/test_campaign_library_v0615.py tests/test_image_anchored_campaign_v0618.py tests/test_combined_platform_routes.py tests/test_stage_schema_v066.py tests/test_login_hardening_v7170.py tests/test_business_account_security_v0623.py tests/test_social_existing_link_v7168.py tests/test_identity_hardening_v7167.py tests/test_identity_provider_contract_v7167.py tests/test_core_social_auth_security_20261123.py tests/test_staging_google_readiness_20261124.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci && npm run build && python ../scripts/check_react_build.py && npx vitest run src/release-update.test.jsx src/campaigns-v7155.test.jsx src/responsive_home_v7161.test.jsx src/campaign-desktop-layout.test.jsx src/existing-social-link.test.jsx
        working-directory: backend/frontend
      - run: npm ci && VITE_API_BASE=/business VITE_PRUVS_CUSTOMER_URL= npm run build -- --base=/business/
        working-directory: backend/business_frontend
  loyalty-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pruvs_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: pruvs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pruvs_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      PRUVS_TEST_DATABASE_URL: postgresql+psycopg://pruvs_test:test_only@localhost:5432/pruvs_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt -r business-requirements.txt pytest
      - run: python -m pytest -q tests/test_loyalty_management_v0624.py
