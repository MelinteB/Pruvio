name: Validate staging Google and login parity

on:
  pull_request:
    branches:
      - 'release/core-7.1.66-business-0.6.22'
    paths:
      - 'backend/app/react_main.py'
      - 'backend/app/react_app/api.py'
      - 'backend/app/react_app/social_auth.py'
      - 'backend/app/react_app/phone_api.py'
      - 'backend/app/services/onboarding_otp_service.py'
      - 'backend/app/services/phone_numbers.py'
      - 'backend/frontend/src/**'
      - 'backend/tests/test_combined_platform_routes.py'
      - 'backend/tests/test_core_social_auth_security_20261123.py'
      - 'backend/tests/test_phone_numbers_country_signup.py'
      - 'backend/tests/test_staging_google_readiness_20261124.py'
      - '.github/workflows/verify-staging-google-parity-20261124.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated test dependencies
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check -q pytest fastapi httpx sqlalchemy python-dotenv python-multipart 'PyJWT[crypto]>=2.9,<3' phonenumbers email-validator 'psycopg[binary]' pywebpush webauthn
      - name: Verify staging Google and strict database isolation source
        working-directory: backend
        run: |
          python -m compileall -q app/react_app/social_auth.py app/services/phone_numbers.py app/react_main.py
          python -m pytest -q tests/test_phone_numbers_country_signup.py tests/test_core_social_auth_security_20261123.py tests/test_combined_platform_routes.py tests/test_stage_schema_v066.py tests/test_staging_google_readiness_20261124.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/frontend/package-lock.json
      - name: Install frontend
        working-directory: backend/frontend
        run: npm ci --no-audit --no-fund
      - name: Test login, registration and phone picker
        working-directory: backend/frontend
        run: npx vitest run src/login_method_grid.test.jsx src/optional_registration.test.jsx src/phone_number_field.test.jsx
      - name: Verify staging Core frontend build
        working-directory: backend/frontend
        run: npm run build
